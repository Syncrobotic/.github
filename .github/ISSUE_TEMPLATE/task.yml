name: Task
description: Planned engineering work, refactoring or tech debt.
title: "[Area] what to do"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        One task, one deliverable. Write the title in English and in the imperative, e.g. `[Dashboard] Show a skeleton while the device list loads`.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What's the problem today? Link the files, issues or discussions involved.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      description: Each item should be something a reviewer can check.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Risks and notes
      description: Breaking changes, other repos involved, rollout or migration.
