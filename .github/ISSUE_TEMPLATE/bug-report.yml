name: Bug report
description: Something doesn't work the way it should.
title: "[Area] what goes wrong"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Write the title in English, e.g. `[Gateway] Camera preview stays black after a server restart`. The rest can be in any language.
        Found a security problem? Don't file it here; follow the [security policy](https://github.com/Syncrobotic/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see? What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Branch and commit, release tag, or robot / device build.
      placeholder: dev @ 0de27aa, or v1.4.0 on G23-07
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: Helps triage. The owner sets the priority label.
      options:
        - Outage, data loss or a safety risk
        - Something important is broken, no workaround
        - Broken, but there's a workaround
        - Minor or cosmetic
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove secrets and customer data first.
      render: shell
