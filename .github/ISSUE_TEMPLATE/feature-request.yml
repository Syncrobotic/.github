name: Feature request
description: Propose something new for a product or tool.
title: "[Area] what should be possible"
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This template is for the *what* and *why*. If the work is already agreed and you're scoping it, use **Task** instead.
        Write the title in English. The rest can be in any language.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this, and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What we could do
      description: Your proposal. Alternatives you considered are welcome too.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we'll know it's done
      value: |
        - [ ] 
    validations:
      required: true
